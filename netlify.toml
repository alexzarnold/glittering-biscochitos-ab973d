# ============================================================================
# NETLIFY CONFIGURATION
# ----------------------------------------------------------------------------
# This site has no build step. Netlify just serves the files as they are.
# You almost certainly never need to edit this file.
# ============================================================================

[build]
  # Everything lives in the top level of this folder, so that is what we publish.
  publish = "."

  # Only the /research section is generated (from Markdown in _research/).
  # Every other page is still plain HTML served exactly as written.
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ----------------------------------------------------------------------------
# Security headers. Sensible defaults for a static site.
# ----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ----------------------------------------------------------------------------
# Cache the fonts, images, and stylesheet for a long time. HTML is not cached
# so that content edits appear immediately after a deploy.
# ----------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ----------------------------------------------------------------------------
# Let people type /join instead of /join.html and still land in the right place.
# Netlify already does this automatically, these are here as a safety net.
# ----------------------------------------------------------------------------
[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 301

[[redirects]]
  from = "/meetings"
  to = "/meetings.html"
  status = 301

[[redirects]]
  from = "/research"
  to = "/research/index.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
